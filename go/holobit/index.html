<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HoloBit</title>
<style>html,body{margin:0;height:100%;background:#161616;color:#fff;font:15px/1.5 system-ui,sans-serif}body{display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;box-sizing:border-box}a{color:#5bc426}</style>
</head>
<body>
<p>Opening HoloBit…<br><a id="go" href="https://holobit.xyz/">Continue</a></p>
<script>
  // load the config fresh every time, so a new target takes effect at once
  var go = function () {
    var u = (window.SW_CONFIG && SW_CONFIG.holobitQrUrl) || 'https://holobit.xyz/';
    document.getElementById('go').href = u;
    location.replace(u);
  };
  var s = document.createElement('script');
  s.src = '../../assets/js/config.js?t=' + Date.now();
  s.onload = s.onerror = go;
  document.head.appendChild(s);
</script>
</body>
</html>
